<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Thông Tin Tài Khoản NSNN - Hải Quan KV2</title>
    <style>
        /* Nền trang web */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 20px;
            color: #fff;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Khối giao diện kính mờ (Glassmorphism) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Tiêu đề & Nút bấm */
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { margin: 0 0 15px 0; font-size: 26px; text-transform: uppercase; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); line-height: 1.4; }
        
        .action-buttons { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 25px; }
        .btn { padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: bold; transition: all 0.3s; font-size: 15px; cursor: pointer; border: none; display: flex; align-items: center; gap: 8px;}
        .btn-primary { background: #fff; color: #1976d2; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(255,255,255,0.4); }
        .btn-outline { background: transparent; color: #fff; border: 2px solid #fff; }
        .btn-outline:hover { background: rgba(255,255,255,0.1); transform: translateY(-3px); }

        /* Ô tìm kiếm */
        .search-box {
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.95);
            font-size: 16px;
            margin-bottom: 25px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            outline: none;
            transition: 0.3s;
        }
        .search-box:focus { box-shadow: 0 0 0 3px rgba(255,255,255,0.5); }

        /* Lưới dữ liệu */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 20px;
            color: #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: 0.3s;
            border-left: 6px solid #1976d2;
            position: relative;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        
        .card h3 { margin: 0 0 15px 0; color: #1976d2; font-size: 17px; line-height: 1.4; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; display: flex; align-items: flex-start; gap: 8px;}
        .stt-badge { background: #1976d2; color: #fff; padding: 2px 8px; border-radius: 6px; font-size: 14px; }
        
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; border-bottom: 1px dashed #e0e0e0; padding-bottom: 6px; }
        .info-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .info-label { font-weight: 600; color: #555; }
        .info-value { text-align: right; max-width: 60%; word-break: break-word; color: #111; font-weight: 500; }
        .highlight { color: #d32f2f; font-weight: 700; font-size: 15px; }

        #loading { text-align: center; font-size: 18px; padding: 30px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px;}

        /* Footer */
        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.2); }
        .footer-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .counter-box { background: rgba(0,0,0,0.2); padding: 8px 15px; border-radius: 8px; display: flex; align-items: center; gap: 10px; }
        .location { text-align: center; font-size: 13px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; }
        .location a { color: #fff; text-decoration: none; }
        .location a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="glass-panel">
    
    <div class="header">
        <h1>Tra Cứu Thông Tin Tài Khoản NSNN<br>Chi Cục Hải Quan Khu Vực II</h1>
    </div>

    <!-- Nút chức năng -->
    <div class="action-buttons">
        <a href="#" class="btn btn-primary">🔍 Tra cứu nợ thuế</a>
        <a href="#" class="btn btn-outline">📝 Nộp mẫu 56</a>
    </div>

    <!-- Thanh tìm kiếm -->
    <input type="text" id="search-input" class="search-box" placeholder="🔍 Nhập từ khóa để tìm kiếm (Tên hải quan, mã đơn vị, ký hiệu TK, mã NH...)">

    <!-- Khu vực hiển thị dữ liệu -->
    <div id="loading">⏳ Đang tải dữ liệu, vui lòng chờ trong giây lát...</div>
    <div id="nsnn-grid" class="grid-container" style="display: none;"></div>

    <!-- Footer & Bộ đếm -->
    <footer>
        <div class="footer-content">
            <div style="font-weight: bold; font-size: 14px;">
                © Sản phẩm của Đoàn thanh niên<br>Chi cục Hải quan khu vực II
            </div>
            
            <div class="counter-box">
                <span style="font-size: 12px; font-weight: bold; text-transform: uppercase;">Lượt truy cập:</span>
                <!-- BỘ ĐẾM HITWEBCOUNTER CỦA BẠN (Mã 21511758) -->
                <a href="https://www.hitwebcounter.com/" target="_blank" rel="noopener" title="Website">
                    <img src="https://www.hitwebcounter.com/counter/counter.php?page=21511758&amp;style=0025&amp;nbdigits=5&amp;type=page" alt="Website" decoding="async" style="border:0; height: 22px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));" />
                </a>
            </div>
        </div>
        
        <div class="location">
            <a href="https://maps.app.goo.gl/fGw6eB8g49TQrmxs6">
                📍 Số 02 Hàm Nghi, Phường Sài Gòn, Thành phố Hồ Chí Minh
            </a>
        </div>
    </footer>

</div>

<script>
    // ==========================================
    // 1. DÁN ĐƯỜNG LINK API CỦA BẠN VÀO DƯỚI ĐÂY
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzuVEIS8wBt8jcav6WE-wex_d_uAWkq1vv5iJPo06ecbgBfZjNF2N0UTY2JB7f6bSlENg/exec"; 
    
    let globalData = [];

    // Hàm loại bỏ dấu tiếng Việt để tìm kiếm dễ dàng hơn
    function removeAccents(str) {
        if(!str) return "";
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
    }

    // Hàm vẽ giao diện thẻ (Card)
    function renderData(dataArray) {
        const container = document.getElementById('nsnn-grid');
        let html = "";
        
        if(!dataArray || dataArray.length === 0) {
            container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; background: rgba(255,255,255,0.9); border-radius: 12px; color: #333;">
                <span style="font-size: 40px;">🔍</span><br><br>Không tìm thấy thông tin tài khoản phù hợp với từ khóa của bạn.
            </div>`;
            return;
        }

        dataArray.forEach(item => {
            html += `
            <div class="card">
                <h3><span class="stt-badge">#${item.stt || '-'}</span> ${item.coQuanHaiQuan || 'Chưa cập nhật'}</h3>
                
                <div class="info-row">
                    <span class="info-label">Mã Đơn vị:</span>
                    <span class="info-value">${item.maDonVi || '-'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Ký hiệu TK:</span>
                    <span class="info-value highlight">${item.kyHieuTK || '-'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Tên tài khoản KB:</span>
                    <span class="info-value">${item.tenTaiKhoan || '-'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Mã cơ quan thu:</span>
                    <span class="info-value">${item.maCQThu || '-'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Tên KBNN:</span>
                    <span class="info-value" style="color: #1565c0; font-weight: bold;">${item.tenKBNN || '-'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Mã KBNN:</span>
                    <span class="info-value">${item.maKBNN || '-'}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Mã Ngân hàng:</span>
                    <span class="info-value">${item.maNH || '-'}</span>
                </div>
            </div>`;
        });
        
        container.innerHTML = html;
    }

    // Xử lý sự kiện khi gõ vào ô tìm kiếm
    document.getElementById('search-input').addEventListener('input', function(e) {
        const kwClean = removeAccents(e.target.value).trim();
        
        if (!kwClean) {
            renderData(globalData);
            return;
        }

        const filtered = globalData.filter(item => {
            const textToSearch = removeAccents(`
                ${item.stt} ${item.coQuanHaiQuan} ${item.maDonVi} ${item.kyHieuTK} 
                ${item.tenTaiKhoan} ${item.maCQThu} ${item.maKBNN} 
                ${item.maNH} ${item.tenKBNN}
            `);
            return textToSearch.includes(kwClean);
        });
        
        renderData(filtered);
    });

    // ==========================================
    // 2. LẤY DỮ LIỆU TỪ GOOGLE SHEETS
    // ==========================================
    fetch(API_URL)
        .then(response => response.json())
        .then(data => {
            globalData = data;
            document.getElementById('loading').style.display = 'none'; // Ẩn chữ đang tải
            document.getElementById('nsnn-grid').style.display = 'grid'; // Hiện khung dữ liệu
            renderData(globalData);
        })
        .catch(error => {
            console.error("Lỗi tải dữ liệu:", error);
            document.getElementById('loading').innerHTML = "❌ Lỗi: Không thể kết nối đến cơ sở dữ liệu. Vui lòng kiểm tra lại link API.";
        });
</script>

</body>
</html>
