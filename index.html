<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu NSNN - Chi cục Hải quan khu vực II</title>
    <!-- Tích hợp Font Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900&display=swap" rel="stylesheet">
    
    <style>
        /* ================= CSS CƠ BẢN & BỐ CỤC ================= */
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #333;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        .header-container h1 {
            color: #1565c0;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        /* Ô Tìm Kiếm */
        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 15px 20px;
            border-radius: 30px;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            font-size: 16px;
            font-family: 'Roboto', sans-serif;
            outline: none;
            transition: 0.3s;
        }
        .search-box:focus {
            box-shadow: 0 4px 20px rgba(25, 118, 210, 0.3);
            transform: translateY(-2px);
        }

        /* Lưới chứa các thẻ Card */
        #card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ================= MẪU KẾT HỢP: KHỐI NỔI 3D + ĐIỂM NHẤN VIỀN TRÊN ================= */
        .card { 
            background: #f4f7f9; 
            border-radius: 16px; 
            padding: 22px; 
            color: #333; 
            box-shadow: 6px 6px 16px #d1d9e6, -6px -6px 16px #ffffff; 
            transition: all 0.3s ease; 
            border: 1px solid #fff; 
            border-top: 6px solid #1976d2; 
            position: relative; 
            overflow: hidden; 
        }
        .card:hover { 
            transform: translateY(-4px); 
            box-shadow: 8px 8px 20px #c5d0e0, -8px -8px 20px #ffffff; 
            border-top-color: #d32f2f; 
        }
        .card h3 { margin: 0 0 15px 0; color: #1976d2; font-size: 17px; font-weight: 900; border-bottom: 1px dashed #b0bec5; padding-bottom: 12px; display: flex; align-items: flex-start; gap: 10px; }
        .stt-badge { background: linear-gradient(135deg, #1976d2, #42a5f5); color: #fff; padding: 3px 10px; border-radius: 8px; font-size: 13px; box-shadow: 2px 2px 5px rgba(25, 118, 210, 0.3); }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; border-bottom: 1px dotted #cfd8dc; padding-bottom: 6px; }
        .info-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .info-label { font-weight: 600; color: #607d8b; }
        .info-value { text-align: right; max-width: 65%; word-break: break-word; color: #263238; font-weight: bold; }
        
        /* Khung gộp tài khoản - Hiệu ứng lõm xuống (Inset 3D) */
        .account-group-box { 
            background: #f4f7f9; 
            border-radius: 12px; 
            padding: 15px; 
            margin-top: 15px; 
            box-shadow: inset 4px 4px 8px #d1d9e6, inset -4px -4px 8px #ffffff; 
        }
        .account-group-title { font-size: 12px; font-weight: bold; color: #1976d2; margin-bottom: 12px; text-transform: uppercase; }
        
        /* Từng tài khoản - Hiệu ứng nổi lên (Outset 3D) */
        .account-item { 
            background: #f4f7f9; 
            padding: 10px 12px; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            border-left: 4px solid #d32f2f; 
            box-shadow: 3px 3px 6px #d1d9e6, -3px -3px 6px #ffffff; 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            transition: 0.2s;
        }
        .account-item:hover { transform: scale(1.02); }
        .account-item:last-child { margin-bottom: 0; }
        .acc-number { font-size: 17px; font-weight: 900; color: #d32f2f; }
        .acc-name { font-size: 13px; color: #455a64; font-weight: 500;}

        /* ================= CSS CHO LINK GOOGLE MAPS ================= */
        .map-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #1976d2;
            text-decoration: none;
            transition: all 0.2s ease;
            font-weight: bold;
            text-align: right;
            justify-content: flex-end;
        }
        .map-link:hover {
            color: #d32f2f;
            text-decoration: underline;
        }
        .map-icon {
            flex-shrink: 0;
            fill: currentColor;
            transition: transform 0.2s ease;
        }
        .map-link:hover .map-icon {
            transform: translateY(-2px) scale(1.1);
        }

        #loading { text-align: center; font-size: 16px; font-weight: bold; color: #1565c0; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Tra cứu thông tin NSNN</h1>
        <p>Chi cục Hải quan khu vực II</p>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Nhập mã đơn vị hoặc tên đơn vị để tìm kiếm...">
    </div>

    <div id="loading">Đang tải dữ liệu...</div>
    <div id="card-container"></div>

    <script>
        // Biến toàn cục lưu trữ dữ liệu
        let allData = [];

        // HÀM 1: Lấy dữ liệu JSON
        async function loadData() {
            try {
                // ĐỔI TÊN FILE JSON CỦA BẠN Ở ĐÂY NẾU CẦN
                const response = await fetch('data.json'); 
                
                if (!response.ok) {
                    throw new Error("Không thể tải file JSON. Đang dùng dữ liệu mẫu.");
                }
                allData = await response.json();
            } catch (error) {
                console.warn(error);
                // DỮ LIỆU MẪU ĐỂ TEST KHI CHẠY TRỰC TIẾP KHÔNG QUA SERVER (Bỏ đi khi chạy thực tế)
                allData = [
                    {
                        maDonVi: "02B1",
                        tenDonVi: "Chi cục Hải quan quản lý hàng gia công",
                        tenKBNN: "KBNN TP Hồ Chí Minh",
                        maKBNN: "0170",
                        diachiMaps: "https://maps.app.goo.gl/abcdef", // Ví dụ có link map
                        danhSachTaiKhoan: [
                            { soTaiKhoan: "7111", tenTaiKhoan: "Thu ngân sách nhà nước" },
                            { soTaiKhoan: "3511", tenTaiKhoan: "Tiền gửi của Kho bạc Nhà nước" }
                        ]
                    },
                    {
                        maDonVi: "02B2",
                        tenDonVi: "Chi cục Hải quan quản lý hàng đầu tư",
                        tenKBNN: "KBNN Quận 1",
                        maKBNN: "0171",
                        diachiMaps: "", // Ví dụ bỏ trống link map
                        danhSachTaiKhoan: [
                            { soTaiKhoan: "7111", tenTaiKhoan: "Thu ngân sách nhà nước" }
                        ]
                    }
                ];
            }

            document.getElementById('loading').style.display = 'none';
            renderCards(allData);
        }

        // HÀM 2: Hàm tạo thẻ HTML từ dữ liệu
        function renderCards(dataToRender) {
            const container = document.getElementById('card-container');
            container.innerHTML = ''; 

            if (dataToRender.length === 0) {
                container.innerHTML = '<div style="text-align: center; width: 100%; color: #d32f2f; font-weight: bold;">Không tìm thấy kết quả nào!</div>';
                return;
            }

            dataToRender.forEach((item, index) => {
                
                // --- Xử lý Cột K: diachiMaps ---
                let tenKBNNHtml = "";
                if (item.diachiMaps && item.diachiMaps.trim() !== "") {
                    tenKBNNHtml = `
                        <a href="${item.diachiMaps}" target="_blank" class="map-link" title="Xem vị trí trên Google Maps">
                            ${item.tenKBNN}
                            <svg class="map-icon" viewBox="0 0 24 24" width="16" height="16">
                                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                            </svg>
                        </a>
                    `;
                } else {
                    tenKBNNHtml = item.tenKBNN;
                }

                // --- Xử lý danh sách tài khoản ---
                let taiKhoanHtml = "";
                if (item.danhSachTaiKhoan && item.danhSachTaiKhoan.length > 0) {
                    taiKhoanHtml = `
                        <div class="account-group-box">
                            <div class="account-group-title">Danh sách tài khoản thu (${item.danhSachTaiKhoan.length})</div>
                    `;
                    item.danhSachTaiKhoan.forEach(tk => {
                        taiKhoanHtml += `
                            <div class="account-item">
                                <span class="acc-number">${tk.soTaiKhoan}</span>
                                <span class="acc-name">${tk.tenTaiKhoan}</span>
                            </div>
                        `;
                    });
                    taiKhoanHtml += `</div>`;
                }

                // --- Lắp ráp toàn bộ thẻ ---
                const cardHtml = `
                    <div class="card">
                        <h3><span class="stt-badge">#${index + 1}</span> ${item.tenDonVi}</h3>
                        <div class="info-row">
                            <span class="info-label">Mã Đơn vị:</span>
                            <span class="info-value" style="color: #1976d2; font-size: 15px;">${item.maDonVi}</span>
                        </div>
                        
                        <div class="info-row">
                            <span class="info-label">Tên KBNN:</span>
                            <span class="info-value">${tenKBNNHtml}</span>
                        </div>
                        
                        <div class="info-row">
                            <span class="info-label">Mã KBNN:</span>
                            <span class="info-value">${item.maKBNN}</span>
                        </div>
                        
                        ${taiKhoanHtml}
                    </div>
                `;

                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        // HÀM 3: Loại bỏ dấu tiếng Việt để tìm kiếm dễ dàng
        function removeAccents(str) {
            if (!str) return "";
            return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        // HÀM 4: Xử lý sự kiện khi gõ vào ô tìm kiếm
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const keyword = removeAccents(e.target.value);
            
            // Lọc dữ liệu theo Mã Đơn Vị hoặc Tên Đơn Vị
            const filteredData = allData.filter(item => {
                const searchMa = removeAccents(item.maDonVi);
                const searchTen = removeAccents(item.tenDonVi);
                return searchMa.includes(keyword) || searchTen.includes(keyword);
            });
            
            renderCards(filteredData);
        });

        // KÍCH HOẠT CHẠY HÀM KHI MỞ TRANG
        window.onload = loadData;

    </script>
</body>
</html>
